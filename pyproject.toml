[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-worker"
version = "0.1.0"
description = "Webhook worker for yt-dlp downloads and AI subtitle generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "python-docx>=1.1,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
  "faster-whisper>=1.1,<2.0",
  "yt-dlp",
]

[tool.setuptools.packages.find]
include = ["app*"]

